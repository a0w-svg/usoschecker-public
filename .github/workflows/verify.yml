name: Verification
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Source security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/security_check.py
      - run: python3 scripts/security_check.py --history
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  android:
    name: Android verification
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Allow installed JDK 21 on the CI runner
        run: sed -i '/^toolchainVendor=/d' gradle/gradle-daemon-jvm.properties
      - name: Tests, lint and release build without personal credentials
        run: bash gradlew :core:test :app:testDebugUnitTest :app:lintRelease :app:verifyReleaseConfiguration :app:assembleRelease :app:bundleRelease -PisolatedTests --no-daemon
