plugins { id 'com.android.application' }

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { instr -> localProperties.load(instr) }
}
def usosKey = (localProperties.getProperty('usos.consumer.key')
    ?: localProperties.getProperty('usos.key')
    ?: localProperties.getProperty('apiKey')
    ?: localProperties.getProperty('apikey')
    ?: localProperties.getProperty('api.key')
    ?: localProperties.getProperty('CONSUMER_KEY')
    ?: '')?.trim()
def usosSecret = (localProperties.getProperty('usos.consumer.secret')
    ?: localProperties.getProperty('usos.secret')
    ?: localProperties.getProperty('apiSecret')
    ?: localProperties.getProperty('apisecret')
    ?: localProperties.getProperty('api.secret')
    ?: localProperties.getProperty('CONSUMER_SECRET')
    ?: '')?.trim()

def escapeBuildConfig(String val) {
    return val == null ? '' : val.replace('\\', '\\\\').replace('"', '\\"')
}

android {
    namespace 'pl.vistula.checker'
    compileSdk 36
    defaultConfig {
        applicationId 'pl.vistula.checker'
        minSdk 31
        targetSdk 36
        versionCode 6
        versionName '1.0.5'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField "String", "USOS_KEY", '""'
        buildConfigField "String", "USOS_SECRET", '""'
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        debug {
            // Optional separate installation for regression tests; keep personal account data intact.
            if (project.hasProperty('isolatedTests')) applicationIdSuffix '.qa'
            if (!project.hasProperty('isolatedTests')) {
                buildConfigField "String", "USOS_KEY", "\"${escapeBuildConfig(usosKey)}\""
                buildConfigField "String", "USOS_SECRET", "\"${escapeBuildConfig(usosSecret)}\""
            }
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        if (project.hasProperty('optimizedQa')) {
            optimizedQa {
                initWith release
                applicationIdSuffix '.qa'
                signingConfig signingConfigs.debug
                matchingFallbacks = ['release']
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'optimized-qa-rules.pro'
                testProguardFiles 'test-rules.pro'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    if (project.hasProperty('optimizedQa')) testBuildType 'optimizedQa'
    if (project.hasProperty('liveApiTests')) sourceSets.androidTest.java.srcDir 'src/liveTest/java'
    if (project.hasProperty('upgradeTests')) sourceSets.androidTest.java.srcDir 'src/upgradeTest/java'
    if (project.hasProperty('notificationPermissionTests')) sourceSets.androidTest.java.srcDir 'src/notificationPermissionTest/java'
}

tasks.register('verifyReleaseConfiguration') {
    group = 'verification'
    description = 'Rejects release configurations that expose developer credentials or disable release protection.'
    doLast {
        def release = android.buildTypes.release
        if (release.debuggable || !release.minifyEnabled || !release.shrinkResources)
            throw new GradleException('Release must be non-debuggable with code and resource optimization enabled.')
        ['USOS_KEY', 'USOS_SECRET'].each { name ->
            def field = release.buildConfigFields[name] ?: android.defaultConfig.buildConfigFields[name]
            if (field == null || field.value != '""')
                throw new GradleException("Release must not contain embedded ${name}. Enter credentials through the account screen.")
        }
        if (release.signingConfig != null && release.signingConfig.name == 'debug')
            throw new GradleException('Production release must not use the debug signing key.')
    }
}
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    dependsOn tasks.named('verifyReleaseConfiguration')
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':core')
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
