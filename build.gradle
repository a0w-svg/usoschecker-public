buildscript {
    dependencies {
        constraints {
            classpath('org.apache.commons:commons-lang3:3.21.0') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
            classpath('org.bitbucket.b_c:jose4j:0.9.7') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
            classpath('org.bouncycastle:bcprov-jdk18on:1.86') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
            classpath('org.bouncycastle:bcutil-jdk18on:1.86') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
            classpath('org.jdom:jdom2:2.0.6.1') { because 'Remediate build-tool advisories; see DEPENDENCIES.md' }
        }
    }
}

plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.kotlin.multiplatform.library' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
    id 'org.jetbrains.compose' version '1.12.2' apply false
}
